<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Precon Sump">
  <!-- Precon Sump mark: three stacked precast concrete blocks (the sump) on the water gradient.
       Same drawing as the web sidebar logo (web/src/components/app-shell.tsx). -->
  <defs>
    <linearGradient id="ps-water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2557EB"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#ps-water)"/>
  <g transform="translate(6 6)">
    <rect x="3" y="3" width="14" height="4" rx="1" fill="#fff"/>
    <rect x="3" y="8.5" width="9" height="4" rx="1" fill="#fff" opacity="0.85"/>
    <rect x="13.5" y="8.5" width="3.5" height="4" rx="1" fill="#fff" opacity="0.85"/>
    <rect x="3" y="14" width="14" height="3" rx="1" fill="#fff" opacity="0.7"/>
  </g>
</svg>
